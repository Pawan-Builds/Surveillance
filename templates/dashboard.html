<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WormGPT C2 Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f172a; color: #e2e8f0; margin: 0; padding: 0; }
        .header { background-color: #1e293b; padding: 15px 20px; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
        .container { padding: 20px; max-width: 1400px; margin: 0 auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 20px; }
        .card { background-color: #1e293b; border-radius: 8px; padding: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .card h3 { margin-top: 0; color: #38bdf8; border-bottom: 1px solid #334155; padding-bottom: 10px; }
        .stat { display: flex; justify-content: space-between; margin-bottom: 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #334155; }
        th { background-color: #0f172a; }
        .status-active { color: #4ade80; }
        .status-inactive { color: #f87171; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-bug"></i> WormGPT Surveillance Framework</h1>
        <div>System Status: <span class="status-active">Online</span></div>
    </div>

    <div class="container">
        <div class="grid">
            <div class="card">
                <h3>Total Sessions</h3>
                <div class="stat"><span>Active:</span> <strong id="active-sessions">0</strong></div>
                <div class="stat"><span>Exploited:</span> <strong id="exploited-sessions">0</strong></div>
            </div>
            <div class="card">
                <h3>Data Collected</h3>
                <div class="stat"><span>SMS:</span> <strong id="sms-count">0</strong></div>
                <div class="stat"><span>Locations:</span> <strong id="loc-count">0</strong></div>
            </div>
            <div class="card">
                <h3>System Health</h3>
                <div class="stat"><span>Persistence:</span> <strong>Enabled</strong></div>
                <div class="stat"><span>Evasion:</span> <strong>Active</strong></div>
            </div>
        </div>

        <div class="card">
            <h3>Active Targets</h3>
            <table>
                <thead>
                    <tr>
                        <th>Session ID</th>
                        <th>Target Phone</th>
                        <th>OS Version</th>
                        <th>Status</th>
                        <th>Last Seen</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="session-table">
                    <!-- Rendered via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // Simple JS to fetch and render sessions
        async function loadSessions() {
            try {
                const response = await fetch('/api/sessions');
                const sessions = await response.json();
                
                document.getElementById('active-sessions').innerText = sessions.length;
                document.getElementById('exploited-sessions').innerText = sessions.filter(s => s.status === 'exploiting').length;

                const tbody = document.getElementById('session-table');
                tbody.innerHTML = '';

                sessions.forEach(session => {
                    const row = `
                        <tr>
                            <td>${session.session_id}</td>
                            <td>${session.target_phone}</td>
                            <td>${session.target_os}</td>
                            <td class="status-${session.status}">${session.status.toUpperCase()}</td>
                            <td>${new Date().toLocaleTimeString()}</td>
                            <td>
                                <button onclick="exportData('${session.session_id}')">Export</button>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } catch (e) {
                console.error("Error loading sessions", e);
            }
        }
        
        function exportData(sessionId) {
            window.location.href = `/api/data/${sessionId}`;
        }

        loadSessions();
        setInterval(loadSessions, 5000); // Poll every 5 seconds
    </script>
</body>
</html>
